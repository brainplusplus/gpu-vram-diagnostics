[package]
name = "vram-diagnostics"
version = "0.1.0"
edition = "2021"
description = "Professional-grade VRAM diagnostic tool for NVIDIA GPUs"
license = "MIT"

[dependencies]
# GUI
eframe = "0.31"
egui = "0.31"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Progress (CLI mode)
indicatif = "0.17"

# Utilities
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
libloading = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
